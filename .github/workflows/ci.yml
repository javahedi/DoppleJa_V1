name: DoppleJa CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  test:
    name: Python Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: doppleja_v1
          POSTGRES_PASSWORD: ci-password-only
          POSTGRES_DB: doppleja_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U doppleja_v1 -d doppleja_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_USER: doppleja_v1
      POSTGRES_PASSWORD: ci-password-only
      POSTGRES_DB: doppleja_test
      DB_HOST: localhost
      AUTH_SECRET_KEY: ci-only-secret-not-for-production-1234567890
      AUTH_COOKIE_SECURE: 'false'
      AUTH_DEV_PRINT_LINK: 'false'
      PUBLIC_API_URL: http://localhost:8001
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
      - name: Migrate test database
        run: python -m alembic -c alembic.ini upgrade head
      - name: Run tests
        run: python -m pytest tests/ -v
