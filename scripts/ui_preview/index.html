<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DoppleJa — Local UI Preview</title>
<link rel="stylesheet" href="/app-assets/css/styles.css"><link rel="stylesheet" href="/app-assets/css/profile-create-v1.css">
<style>
body{padding:0!important;margin:0;background:#eff0f8;color:#251050;font-family:system-ui,sans-serif}
.preview-toolbar{position:sticky;top:0;z-index:200;background:#251050;color:white;padding:12px 18px;display:flex;gap:14px;flex-wrap:wrap;align-items:center;justify-content:center}
.preview-toolbar label{display:flex;gap:8px;align-items:center;font-weight:650;font-size:13px}
.preview-toolbar select{border:1px solid #cac1ed;border-radius:8px;background:#fff;color:#24114e;padding:8px;font-size:14px}
.preview-toolbar .tag{font-size:12px;color:#fff6b7}
.preview-frame{width:375px;max-width:100%;min-height:861px;background:#fff;margin:20px auto;border:1px solid #d7d1e9;border-radius:22px;overflow:hidden;box-shadow:0 18px 60px #28135a29}
.preview-frame .app-shell{width:100%;max-width:100%;margin:0;border-radius:0;box-shadow:none;min-height:861px;overflow:visible}
.preview-frame .screen{min-height:861px}
.preview-note{text-align:center;color:#544783;font-size:13px;margin:0 12px 20px}
.preview-frame .dj-pc-page{min-height:861px}
.preview-frame .dj-pc-submit{cursor:not-allowed}
/* Preview-only improvements for profile creation */
.preview-frame .dj-pc-progress{display:none!important}
.preview-frame .dj-pc-header{margin-bottom:18px}
.preview-frame .dj-pc-hero{margin-top:0}
.preview-frame[data-width="768"] .dj-pc-page{padding:22px 28px 46px!important}
.preview-frame[data-width="768"] .dj-pc-header img{width:240px;max-height:78px}
.preview-frame[data-width="768"] .dj-pc-hero{grid-template-columns:minmax(0,1fr) 290px;align-items:end;gap:18px;min-height:230px;margin:6px 0 14px}
.preview-frame[data-width="768"] .dj-pc-hero div{padding-left:0}
.preview-frame[data-width="768"] .dj-pc-hero h1{font-size:56px;line-height:1.02;max-width:360px}
.preview-frame[data-width="768"] .dj-pc-hero p{font-size:16px;max-width:360px}
.preview-frame[data-width="768"] .dj-pc-hero img{width:290px;height:220px;object-fit:contain;object-position:right bottom;border-radius:28px;mask-image:none}
.preview-frame[data-width="768"] .dj-pc-panel{padding:20px 18px}
@media(max-width:500px){.preview-toolbar{padding:9px;gap:8px}.preview-frame{margin:8px auto;border-radius:0}.preview-note{padding:8px}}
</style></head><body>
<nav class="preview-toolbar" aria-label="Entwickler-Vorschau">
<strong>DoppleJa · UI Preview</strong>
<label>Seite <select id="screen"><option value="worker">Arbeitnehmer · Profil erstellen</option><option value="employer">Arbeitgeber · Profil erstellen</option></select></label>
<label>Breite <select id="width"><option value="320">320 px</option><option value="375" selected>375 px</option><option value="425">425 px</option><option value="465">465 px</option><option value="768">768 px</option></select></label>
<span class="tag">Nur Vorschau · Keine Datenbank</span>
</nav>
<div class="preview-frame" id="frame"><div class="app-shell"><main id="app"></main><div id="toast"></div></div></div>
<p class="preview-note">Dies ist die echte Profile-Creation-Komponente mit Demoformular. Speichern und Navigation sind deaktiviert.</p>
<script>
// Prevent every form action and navigation in preview, including event handlers added by modules.
document.addEventListener('submit',event=>{event.preventDefault();event.stopImmediatePropagation();},true);
document.addEventListener('click',event=>{const b=event.target.closest('[data-go]');if(b){event.preventDefault();event.stopImmediatePropagation();}},true);
const root=document.getElementById('app'),frame=document.getElementById('frame');
function setup(){
 const employer=document.getElementById('screen').value==='employer';
 // Exactly the structure the installed profile-create-v1.js transforms; never calls FastAPI.
 const fields=employer?`<select name="employer_type"><option value="private">Privatperson</option></select><input name="display_name"><input name="category"><input name="city"><textarea name="description"></textarea>`:`<input name="display_name"><input name="profession"><input name="city"><select name="availability"><option value="Flexibel">Flexibel</option></select><textarea name="bio"></textarea>`;
 root.innerHTML=`<section class="screen"><h1 class="title">Profil erstellen</h1><form id="profile-form">${fields}<input name="photo_url"></form></section>`;
 // Trigger existing module's root observer; if user has not installed Profile Creation V1, show a diagnostic.
 setTimeout(()=>{if(!root.querySelector('.dj-pc-page'))root.innerHTML='<section class="screen"><h1>Profil-Patch fehlt</h1><p>Bitte zuerst DoppleJa_Profile_Creation_V1 installieren.</p></section>';},160);
}
function resize(){const w=document.getElementById('width').value;frame.style.width=w+'px';frame.setAttribute('data-width', w);}
document.getElementById('screen').addEventListener('change',setup);
document.getElementById('width').addEventListener('change',resize);
const query=new URLSearchParams(location.search);
if(['worker','employer'].includes(query.get('screen')))document.getElementById('screen').value=query.get('screen');
if(['320','375','425','465','768'].includes(query.get('width')))document.getElementById('width').value=query.get('width');
resize();
</script>
<script src="/app-assets/js/profile-create-v1.js"></script>
<script>setup();</script>
</body></html>
